# Projet Cloudflare Pages. La base D1 se crée dans Cloudflare (Storage & Databases -> D1), puis son id va ci-dessous.
name = "mogx"
pages_build_output_dir = "src"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "mogx"
database_id = "d6b4da50-aa9e-4c21-b813-9cad3b018324"

# Réglages publics (pas secrets) : modifiables ici seulement, Cloudflare ne garde dans son tableau de bord que les secrets.
[vars]
SUPPORT_EMAIL = "contact@mogx.fr"
MAIL_REPLY_TO = "contact@mogx.fr"
MAIL_FROM = "MOGX <bonjour@mogx.fr>"
