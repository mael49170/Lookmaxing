<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Connexion</title>
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/q/quiz.css">
</head>
<body>
<main class="screen">
  <div class="brand">Lookmaxing</div>
  <h1 class="title" tabindex="-1">Retrouve ton plan</h1>
  <p class="lead" id="intro">Entre l'e-mail utilisé au paiement. On t'envoie un code, pas besoin de mot de passe.</p>
  <div id="msg"></div>
  <form id="f1" class="stack" novalidate>
    <div class="field"><label for="email">Ton e-mail</label><input id="email" class="input" type="email" inputmode="email" autocomplete="email" required></div>
    <button class="btn btn--primary" type="submit">Recevoir mon code</button>
  </form>
  <form id="f2" class="stack" novalidate hidden>
    <div class="field"><label for="code">Le code à 6 chiffres</label><input id="code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required></div>
    <button class="btn btn--primary" type="submit">Me connecter</button>
    <button class="btn btn--ghost" type="button" id="again">Changer d'adresse</button>
  </form>
  <p class="legal">Pas encore de plan ? <a href="/q/">Fais le quiz</a>.</p>
</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const say = (t, err) => { $("msg").innerHTML = t ? `<div class="alert" role="${err ? "alert" : "status"}" style="${err ? "" : "border-left-color:var(--c-success)"}">${t}</div>` : ""; };
  const q = new URLSearchParams(location.search);
  if (q.get("lien") === "expire") say("Ce lien a expiré ou a déjà servi. Demande un nouveau code.", true);
  if (q.get("paye") === "1") say("Paiement reçu. Entre ton e-mail pour ouvrir ton espace.");
  async function api(path, body) {
    const res = await fetch("/api/" + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Une erreur est survenue.");
    return data;
  }
  $("f1").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = e.submitter; b.setAttribute("aria-busy", "true");
    try {
      const r = await api("auth-start", { email: $("email").value.trim() });
      $("f1").hidden = true; $("f2").hidden = false; $("code").focus();
      say("Si un plan existe avec cette adresse, un code vient d'y partir. Regarde aussi dans les indésirables." + (r.devCode ? ` (code de test : ${r.devCode})` : ""));
    } catch (err) { say(err.message, true); } finally { b.removeAttribute("aria-busy"); }
  });
  $("f2").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = e.submitter; b.setAttribute("aria-busy", "true");
    try { await api("auth-verify", { email: $("email").value.trim(), code: $("code").value }); location.href = "/app/"; }
    catch (err) { say(err.message, true); b.removeAttribute("aria-busy"); }
  });
  $("again").addEventListener("click", () => { $("f2").hidden = true; $("f1").hidden = false; say(""); $("email").focus(); });
</script>
</body>
</html>
